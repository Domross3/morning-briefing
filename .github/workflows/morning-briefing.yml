name: Morning Briefing

# Timing is driven by an EXTERNAL trigger (cron-job.org), not GitHub's own
# scheduler. GitHub Actions scheduled workflows on free/public repos were
# firing 1–3 HOURS late (e.g. a 9:23 target landing at 12:32). cron-job.org
# hits the workflow_dispatch API at 9:23 AM America/Detroit and GitHub runs
# it within seconds — reliable to-the-minute delivery.
#
# The `schedule:` trigger was intentionally REMOVED so we don't get a second,
# late-afternoon duplicate brief. To re-add a native fallback, restore:
#   schedule:
#     - cron: '23 13 * * *'   # 13:23 UTC ≈ 9:23 ET (EDT)
on:
  workflow_dispatch: {}

permissions:
  contents: write   # required for the dedup-history commit-back step

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 15 min budget: the LLM opportunity hunter does web_search + web_fetch and
    # can take several minutes on its own. Code-level deadline in
    # opportunity-hunter.js still caps it at ~4 min so the rest of the brief
    # ships even if the hunter spins.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_TO_EMAIL: ${{ vars.BRIEF_TO_EMAIL }}
          # Optional LLM enhancement. If ANTHROPIC_API_KEY is unset, the brief
          # falls back to templated synthesis (still ships, just less sharp).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_LLM_MODEL: ${{ vars.BRIEF_LLM_MODEL }}
        run: npm run brief

      - name: Upload rendered HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brief-html-${{ github.run_id }}
          path: out/latest-brief.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated dedup history
        if: success()
        run: |
          if git diff --quiet history/sent-log.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "morning-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/sent-log.json
          git commit -m "chore(history): dedup log $(date -u +%Y-%m-%d)"
          git push
